plugins {
    id 'com.gradleup.shadow'
}

def commonProject = project(':common-1.21.1')
ext.minecraft_version = commonProject.minecraft_version
ext.architectury_api_version = commonProject.architectury_api_version
ext.neoforge_version = commonProject.neoforge_version

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        liveJoinTestClient {
            client()
            runDir("run/live-join/client")
            property "simplyspeakers.liveJoinTest", "true"
            programArgs "--quickPlayMultiplayer", "127.0.0.1:25575"
        }
        liveJoinTestServer {
            server()
            runDir("run/live-join/server")
            programArg "nogui"
        }
    }
}

sourceSets.main.java.srcDir('../shared/loader-neoforge/src/main/java')

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.ryanhcode.dev/releases' }
}

dependencies {
    neoForge "net.neoforged:neoforge:$project.neoforge_version"

    // OpenUI MC - required client-side UI framework (matching NeoForge 1.21.1 module)
    modImplementation "com.nstut:openui-mc-neoforge-1.21.1:${project.openui_version}"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$project.architectury_api_version"

    include(api("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:$project.sable_companion_version"))

    // JLayer (non-MC dependency)
    implementation "javazoom:jlayer:1.0.1"
    forgeRuntimeLibrary "javazoom:jlayer:1.0.1"
    shadowBundle "javazoom:jlayer:1.0.1"

    // Shared common module (pure Java, no MC dependencies)
    // implementation for compile-time only
    // The common classes are bundled via common-1.21.1's shadowBundle and available through transformProductionNeoForge
    implementation project(':common')

    common(project(path: ':common-1.21.1', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common-1.21.1', configuration: 'transformProductionNeoForge')

    // Local integration-test mods. These are attached automatically when the
    // sibling source checkouts have been built and are never bundled in releases.
    def localSableJar = rootProject.file('../sable/neoforge/build/libs/sable-neoforge-1.21.1-2.0.5.jar')
    def localSableRapierJar = rootProject.file('../sable/sable_rapier/build/libs/sable-sable_rapier-1.21.1-2.0.5.jar')
    def localAeronauticsJars = [
            rootProject.file('../Simulated-Project/simulated/neoforge/build/libs/simulated-neoforge-1.21.1-1.3.1.jar'),
            rootProject.file('../Simulated-Project/aeronautics/neoforge/build/libs/aeronautics-neoforge-1.21.1-1.3.1.jar'),
            rootProject.file('../Simulated-Project/offroad/neoforge/build/libs/offroad-neoforge-1.21.1-1.3.1.jar')
    ]
    if (localSableJar.exists()) {
        modLocalRuntime files(localSableJar)
        if (localSableRapierJar.exists()) {
            // Loom does not expose the Rapier JarJar nested in the remapped
            // local Sable jar, so place its service provider on the classpath.
            runtimeOnly files(localSableRapierJar)
        }
        modLocalRuntime("com.simibubi.create:create-1.21.1:6.0.10-280") { transitive = false }
        modLocalRuntime "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
        modLocalRuntime "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6"
        modLocalRuntime "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"
        modLocalRuntime("foundry.veil:veil-neoforge-1.21.1:4.3.2") {
            exclude group: "maven.modrinth"
            exclude group: "me.fallenbreath"
        }
        forgeRuntimeLibrary "gg.moonflower:molang-compiler:3.1.1.19"
        forgeRuntimeLibrary "io.github.ocelot:glsl-processor:0.2.3"
    }
    // Load the component jars directly. Loom remaps local runtime mods, but
    // cannot reliably rediscover the JarJar modules nested in the bundled jar.
    if (localSableJar.exists() && localAeronauticsJars.every { it.exists() }) {
        modLocalRuntime files(localAeronauticsJars)
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'archives_name', project.rootProject.archives_name
    inputs.property 'mod_name', project.rootProject.mod_name
    inputs.property 'mod_authors', project.rootProject.mod_authors
    inputs.property 'mod_description', project.rootProject.mod_description
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'architectury_api_version', project.architectury_api_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand inputs.properties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    relocate 'javazoom.jl', 'com.nstut.simplyspeakers.shadow.javazoom.jl'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
