plugins {
    id 'com.gradleup.shadow'
}

def commonProject = project(':common-1.21.1')
ext.minecraft_version = commonProject.minecraft_version
ext.architectury_api_version = commonProject.architectury_api_version
ext.fabric_loader_version = commonProject.fabric_loader_version
ext.fabric_api_version = commonProject.fabric_api_version

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        liveJoinTestClient {
            client()
            runDir("run/live-join/client")
            property "simplyspeakers.liveJoinTest", "true"
            property "simplyspeakers.livePlaybackTest", "true"
            programArgs "--quickPlayMultiplayer", "127.0.0.1:25575"
        }
        liveJoinTestServer {
            server()
            property "simplyspeakers.livePlaybackTest", "true"
            property "simplyspeakers.requireComputerCraft", "true"
            runDir("run/live-join/server")
            programArg "nogui"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"

    // CC:Tweaked API (optional integration; compile-only)
    modCompileOnly "cc.tweaked:cc-tweaked-1.21.1-fabric-api:1.120.2"
    modLocalRuntime "cc.tweaked:cc-tweaked-1.21.1-fabric:1.120.2"
    modLocalRuntime 'net.fabricmc.fabric-api:fabric-api:0.116.12+1.21.1'

    // OpenUI MC - required client-side UI framework (matching Fabric 1.21.1 module)
    modImplementation "com.nstut:openui-mc-fabric-1.21.1:${project.openui_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$project.architectury_api_version"

    modImplementation "com.nstut:openui-mc-fabric-1.21.1:${project.openui_version}"

    include(modApi("dev.ryanhcode.sable-companion:sable-companion-fabric-1.21.1:$project.sable_companion_version"))

    // Match the NeoForge dev environment when the sibling Sable build exists.
    // Expose its nested mods explicitly: Loom dev runs do not load nested jars.
    def localSableJar = rootProject.file('../sable/fabric/build/libs/sable-fabric-1.21.1-2.0.5.jar')
    if (localSableJar.exists()) {
        // The Veil bundled in this Sable build requires these dev runtime minima.
        modLocalRuntime 'net.fabricmc:fabric-loader:0.18.4'
        modLocalRuntime files(localSableJar)
        modLocalRuntime files(zipTree(localSableJar).matching {
            include 'META-INF/jars/sable-sable_rapier-*.jar'
            include 'META-INF/jars/veil-*.jar'
            include 'META-INF/jars/forgeconfigapiport-*.jar'
        })
        runtimeOnly 'org.apache.maven:maven-artifact:3.8.5'
        runtimeOnly 'gg.moonflower:molang-compiler:3.1.1.19'
        runtimeOnly 'io.github.ocelot:glsl-processor:0.2.3'
    }

    // JLayer (non-MC dependency) - needed for MP3 decoding
    implementation "javazoom:jlayer:1.0.1"
    shadowBundle "javazoom:jlayer:1.0.1"

    // Shared common module (pure Java, no MC dependencies)
    // implementation for compile-time, shadowBundle NOT needed as it's bundled via transformProductionFabric
    implementation project(':common')

    common(project(path: ':common-1.21.1', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common-1.21.1', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_name', project.rootProject.mod_name
    inputs.property 'mod_description', project.rootProject.mod_description
    inputs.property 'mod_authors', project.rootProject.mod_authors
    inputs.property 'fabric_loader_version', project.fabric_loader_version
    inputs.property 'archives_name', project.rootProject.archives_name
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'architectury_api_version', project.architectury_api_version
    inputs.property 'openui_version', project.openui_version

    filesMatching('fabric.mod.json') {
        expand version: project.version, mod_name: project.rootProject.mod_name, mod_description: project.rootProject.mod_description, mod_authors: project.rootProject.mod_authors, fabric_loader_version: project.fabric_loader_version, archives_name: project.rootProject.archives_name, minecraft_version: project.minecraft_version, architectury_api_version: project.architectury_api_version, openui_version: project.openui_version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    relocate 'javazoom.jl', 'com.nstut.simplyspeakers.shadow.javazoom.jl'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
