architectury {
    common rootProject.enabled_platforms.split(',')
}

sourceSets.main.java.srcDir('../shared/minecraft-1.21plus/src/main/java')

 // Add shadowBundle configuration for runtime dependencies to be bundled
configurations {
    shadowBundle
}

dependencies {
    // Depend on the shared common module
    implementation project(':common')

    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$project.architectury_api_version"

    api "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:$project.sable_companion_version"

    // Lombok
    compileOnly "org.projectlombok:lombok:1.18.30"
    annotationProcessor "org.projectlombok:lombok:1.18.30"

    // JLayer for MP3 decoding (compile-time only, platforms bundle it)
    compileOnly "javazoom:jlayer:1.0.1"

    // OpenUI MC — compile against the matching 1.21.1 API; loaders provide the runtime mod.
    modCompileOnly "com.nstut:openui-mc-fabric-1.21.1:${project.openui_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// Configure processResources to include common resources directly
// Resources in common module are already in 1.21.1 format
processResources {
    from(project(':common').sourceSets.main.resources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Include :common classes in the jar so they're available at runtime
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        project(':common').sourceSets.main.output
    }
}

test {
    useJUnitPlatform()
}
