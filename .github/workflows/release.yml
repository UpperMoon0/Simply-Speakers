name: Build and Release Mod

on:
  push:
    branches:
      - main 

permissions:
  contents: read

concurrency:
  group: simplyspeakers-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 tools/release_plan.py

  prepare-openui:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache OpenUI Maven Local
        id: cache-openui
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/nstut
          key: openui-maven-cb4610a1598d476123b731f5eef4d8e569057ffa
      - name: Checkout OpenUI MC
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: UpperMoon0/OpenUI-MC
          ref: cb4610a1598d476123b731f5eef4d8e569057ffa
          path: .openui-mc
      - name: Validate OpenUI dependency version
        if: steps.cache-openui.outputs.cache-hit != 'true'
        run: python3 tools/check_release_metadata.py --openui-checkout .openui-mc
      - name: Set up JDK 21 for OpenUI
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Make gradlew executable
        if: steps.cache-openui.outputs.cache-hit != 'true'
        run: chmod +x ./.openui-mc/gradlew
      - name: Install required OpenUI MC artifacts
        if: steps.cache-openui.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./.openui-mc/gradlew -p .openui-mc \
            :fabric-1.20.1:publishToMavenLocal \
            :forge-1.20.1:publishToMavenLocal \
            :fabric-1.21.1:publishToMavenLocal \
            :neoforge-1.21.1:publishToMavenLocal \
            :neoforge-26.1.2:publishToMavenLocal \
            --no-parallel --no-daemon
      - name: Upload OpenUI Maven Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openui-m2
          path: ~/.m2/repository/com/nstut
          if-no-files-found: error

  test-shared:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/live-join-test.yml

  build:
    needs: [plan, prepare-openui]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Minecraft 1.20.1 builds (Java 17/21)
          - java: 21
            version: '1.20.1'
            platform: 'fabric'
            project: 'fabric-1.20.1'
            artifact_pattern: 'simplyspeakers-fabric-1.20.1-*.jar'
          - java: 21
            version: '1.20.1'
            platform: 'forge'
            project: 'forge-1.20.1'
            artifact_pattern: 'simplyspeakers-forge-1.20.1-*.jar'
          # Minecraft 1.21.1 builds (Java 21)
          - java: 21
            version: '1.21.1'
            platform: 'fabric'
            project: 'fabric-1.21.1'
            artifact_pattern: 'simplyspeakers-fabric-1.21.1-*.jar'
          - java: 21
            version: '1.21.1'
            platform: 'neoforge'
            project: 'neoforge-1.21.1'
            artifact_pattern: 'simplyspeakers-neoforge-1.21.1-*.jar'
          # Gradle runs on Java 21; ModDevGradle provisions the Java 25 toolchain.
          - java: 21
            version: '26.1.2'
            platform: 'neoforge'
            project: 'neoforge-26.1.2'
            artifact_pattern: 'simplyspeakers-neoforge-26.1.2-*.jar'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore OpenUI Maven Local Cache
        id: cache-openui
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/nstut
          key: openui-maven-cb4610a1598d476123b731f5eef4d8e569057ffa

      - name: Download OpenUI Maven Artifacts Fallback
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: openui-m2
          path: ~/.m2/repository/com/nstut

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'gradle' 

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare native PacketWeave dependency
        run: python3 tools/prepare_packetweave.py --target "${{ matrix.project }}"

      - name: Test and Build ${{ matrix.platform }} ${{ matrix.version }}
        run: ./gradlew :${{ matrix.project }}:test :${{ matrix.project }}:build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplyspeakers-${{ matrix.platform }}-${{ matrix.version }}
          path: |
            ${{ matrix.project }}/build/libs/${{ matrix.artifact_pattern }}
            !${{ matrix.project }}/build/libs/*-sources.jar
            !${{ matrix.project }}/build/libs/*-dev-shadow.jar
          if-no-files-found: error

  build-requested:
    name: Build requested ${{ matrix.target }} release artifact
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [forge-1.12.2, fabric-1.16.5, forge-1.16.5, fabric-26.2, neoforge-26.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          ref: 672b5b2b7169bef30f5f10b34f296812abe31460
          path: .port-deps/OpenUI-MC
      - uses: actions/checkout@v4
        with:
          repository: UpperMoon0/PacketWeave
          ref: 73a7ade839191fde0fcccc66e1d88ad1b86cb447
          path: .port-deps/PacketWeave
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify published native dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_artifacts.py verify-dependencies
      - name: Build and verify pinned native port
        run: python3 tools/build_requested_release.py "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: simplyspeakers-${{ matrix.target }}
          path: ${{ matrix.target }}/build/libs/simplyspeakers-${{ matrix.target }}-${{ needs.plan.outputs.version }}.jar
          if-no-files-found: error

  bundle:
    name: Verify complete ten-target publication bundle
    needs: [plan, test-shared, build, build-requested]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: simplyspeakers-*
          merge-multiple: true
          path: release-bundle
      - name: Verify exact target identities, bytecode and completeness
        run: python3 tools/release_artifacts.py bundle release-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-bundle
          path: release-bundle/*
          if-no-files-found: error

  publish-curseforge:
    name: Publish ${{ matrix.platform }} ${{ matrix.version }} to CurseForge
    needs: [plan, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '1.12.2', platform: forge, loader_name: Forge, java_version_name: 'Java 8' }
          - { version: '1.16.5', platform: fabric, loader_name: Fabric, java_version_name: 'Java 8' }
          - { version: '1.16.5', platform: forge, loader_name: Forge, java_version_name: 'Java 8' }
          - { version: '26.2', platform: fabric, loader_name: Fabric, java_version_name: 'Java 25' }
          - { version: '26.2', platform: neoforge, loader_name: NeoForge, java_version_name: 'Java 25' }
          - version: '1.20.1'
            platform: 'fabric'
            loader_name: 'Fabric'
            java_version_name: 'Java 17'
          - version: '1.20.1'
            platform: 'forge'
            loader_name: 'Forge'
            java_version_name: 'Java 17'
          - version: '1.21.1'
            platform: 'fabric'
            loader_name: 'Fabric'
            java_version_name: 'Java 21'
          - version: '1.21.1'
            platform: 'neoforge'
            loader_name: 'NeoForge'
            java_version_name: 'Java 21'
          - version: '26.1.2'
            platform: 'neoforge'
            loader_name: 'NeoForge'
            java_version_name: 'Java 25'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: verified-release-bundle
          path: curseforge-artifact

      - name: Read mod version and select release JAR
        id: release_file
        shell: bash
        run: |
          set -euo pipefail

          # gradle.properties is committed with CRLF line endings. Strip CR and
          # surrounding whitespace before writing the value to GITHUB_OUTPUT;
          # otherwise the carriage return becomes a newline in later env values.
          mod_version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties \
            | head -n 1 | tr -d '\r' | xargs)"
          if [[ -z "$mod_version" ]]; then
            echo "Could not read mod_version from gradle.properties" >&2
            exit 1
          fi
          if [[ ! "$mod_version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            printf 'Invalid mod_version value: %q\n' "$mod_version" >&2
            exit 1
          fi

          mapfile -t jars < <(find curseforge-artifact -maxdepth 1 -type f -name "simplyspeakers-${{ matrix.platform }}-${{ matrix.version }}-${mod_version}.jar" \
            ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' | sort)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one runnable JAR, found ${#jars[@]}:" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi

          printf 'mod_version=%s\n' "$mod_version" >> "$GITHUB_OUTPUT"
          printf 'jar_path=%s\n' "${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: '1267397'
          MOD_VERSION: ${{ steps.release_file.outputs.mod_version }}
          CHANGELOG_PATH: changelog/${{ steps.release_file.outputs.mod_version }}.md
          JAR_PATH: ${{ steps.release_file.outputs.jar_path }}
          MINECRAFT_VERSION: ${{ matrix.version }}
          PLATFORM: ${{ matrix.platform }}
          LOADER_NAME: ${{ matrix.loader_name }}
          JAVA_VERSION_NAME: ${{ matrix.java_version_name }}
        run: |
          set -euo pipefail

          if [[ -z "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "Missing required GitHub secret: CURSEFORGE_API_TOKEN" >&2
            exit 1
          fi

          if [[ ! -f "$CHANGELOG_PATH" ]]; then
            echo "Missing release changelog: ${CHANGELOG_PATH}" >&2
            exit 1
          fi

          relations="$(python3 tools/release_artifacts.py relations "$PLATFORM-$MINECRAFT_VERSION")"

          changelog="$(<"$CHANGELOG_PATH")"
          display_name="Simply Speakers ${MOD_VERSION} - ${LOADER_NAME} ${MINECRAFT_VERSION}"
          game_version_names="$(jq -cn \
            --arg minecraftVersion "$MINECRAFT_VERSION" \
            --arg loaderName "$LOADER_NAME" \
            --arg javaVersionName "$JAVA_VERSION_NAME" \
            '[$minecraftVersion, $loaderName, $javaVersionName, "Client", "Server"]')"

          available_versions="$(curl --fail-with-body --silent --show-error \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            "https://minecraft.curseforge.com/api/game/versions")"
          while IFS= read -r version_name; do
            if ! jq -e --arg name "$version_name" 'any(.[]; .name == $name)' \
              <<< "$available_versions" > /dev/null; then
              echo "CurseForge does not recognize game version tag: ${version_name}" >&2
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$game_version_names")

          metadata="$(jq -cn \
            --arg changelog "$changelog" \
            --arg displayName "$display_name" \
            --argjson gameVersionNames "$game_version_names" \
            --argjson relations "$relations" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: $gameVersionNames,
              releaseType: "release",
              relations: $relations
            }')"

          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            --form "file=@${JAR_PATH}" \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"

          file_id="$(jq -er '.id' <<< "$response")"
          echo "Published ${JAR_PATH} to CurseForge as file ID ${file_id}."

  release:
    needs: [plan, bundle, publish-curseforge]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Mod Version
        id: get_version
        run: |
          mod_version_line=$(grep 'mod_version = ' gradle.properties)
          mod_version=$(echo "$mod_version_line" | cut -d '=' -f 2 | xargs)
          echo "mod_version=$mod_version" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: verified-release-bundle
          path: release-bundle

      - name: Reverify release bundle before publishing
        run: python3 tools/release_artifacts.py bundle release-bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.mod_version }}
          target_commitish: ${{ github.sha }}
          overwrite_files: false
          name: "Simply Speakers v${{ steps.get_version.outputs.mod_version }}"
          body: |
            ## Simply Speakers v${{ steps.get_version.outputs.mod_version }}

            Automatic release triggered by commit ${{ github.sha }} to the main branch.

            ### Supported Versions

            | Minecraft | Fabric | Forge | NeoForge |
            |-----------|--------|-------|----------|
            | 1.12.2    | -      | Yes   | -        |
            | 1.16.5    | Yes    | Yes   | -        |
            | 1.20.1    | Yes    | Yes   | -        |
            | 1.21.1    | Yes    | -     | Yes      |
            | 26.1.2    | -      | -     | Yes      |
            | 26.2      | Yes    | -     | Yes      |

            All ten native target JARs and SHA256SUMS are attached. Optional
            integrations and native runtime qualification limits are documented
            in docs/requested-generations.md at this release commit.

          draft: false
          prerelease: false
          files: |
            release-bundle/*.jar
            release-bundle/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
