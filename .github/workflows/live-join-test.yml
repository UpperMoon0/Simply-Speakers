name: Live client join test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "common/**"
      - "common-1.20.1/**"
      - "common-1.21.1/**"
      - "shared/**"
      - "fabric-1.20.1/**"
      - "forge-1.20.1/**"
      - "fabric-1.21.1/**"
      - "neoforge-1.21.1/**"
      - "neoforge-26.1.2/**"
      - "tools/live_join_test.py"
      - ".github/workflows/live-join-test.yml"

jobs:
  live-join:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-1.20.1
          - target: forge-1.20.1
          - target: fabric-1.21.1
          - target: neoforge-1.21.1
          - target: neoforge-26.1.2
    steps:
      - uses: actions/checkout@v4
      - name: Checkout OpenUI MC
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          # Pin the reviewed OpenUI PR revision that provides the 0.0.7 API.
          # A commit pin keeps this cross-repository test reproducible after merge.
          ref: d1c6c9ee174befd6cfb93eebfd769a1b3bfa5f69
          path: .openui-mc
      - name: Verify OpenUI-MC version alignment
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^openui_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          actual="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' .openui-mc/gradle.properties | head -n1 | tr -d '\r' | xargs)"
          if [[ -z "$expected" || -z "$actual" || "$actual" != "$expected" ]]; then
            echo "OpenUI version mismatch: Simply Speakers requires '$expected' but the checked-out source publishes '$actual'." >&2
            exit 1
          fi
      # OpenUI's Gradle plugins require Java 21 even when publishing a Java 17 artifact.
      - name: Set up OpenUI build JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Make Gradle executable
        run: chmod +x gradlew .openui-mc/gradlew
      - name: Install matching OpenUI MC artifact
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "neoforge-26.1.2" ]]; then
            targets=(":neoforge-26.1.2:publishToMavenLocal")
          else
            # Legacy Gradle invocations configure all four legacy loader modules.
            targets=(
              ":fabric-1.20.1:publishToMavenLocal"
              ":forge-1.20.1:publishToMavenLocal"
              ":fabric-1.21.1:publishToMavenLocal"
              ":neoforge-1.21.1:publishToMavenLocal"
            )
          fi
          for target in "${targets[@]}"; do
            ./.openui-mc/gradlew -p .openui-mc "$target"
          done
      - name: Run common unit and wiring tests
        run: ./gradlew :common:test
      - name: Run automatic real-client join test
        run: python3 tools/live_join_test.py --target "${{ matrix.target }}"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-join-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/run/live-join/client/logs
            ${{ matrix.target }}/run/live-join/server/logs
          if-no-files-found: ignore
