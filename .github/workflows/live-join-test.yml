name: Layered verification

on:
  workflow_dispatch:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      live_required: ${{ steps.policy.outputs.live_required }}
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: policy
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci_policy.py --event "${{ github.event_name }}" --base "$BASE"

  prepare-openui:
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache OpenUI Maven Local
        id: cache-openui
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/nstut
          key: openui-maven-0d6e10dad6a5ba8615a5798c4369bc4cd6e73300
      - name: Checkout OpenUI MC
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          ref: 0d6e10dad6a5ba8615a5798c4369bc4cd6e73300
          path: .openui-mc
      - name: Validate OpenUI dependency version
        if: steps.cache-openui.outputs.cache-hit != 'true'
        run: python3 tools/check_release_metadata.py --openui-checkout .openui-mc
      - name: Set up OpenUI build JDK
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Make OpenUI Gradle executable
        if: steps.cache-openui.outputs.cache-hit != 'true'
        run: chmod +x .openui-mc/gradlew
      - name: Install OpenUI MC artifacts
        if: steps.cache-openui.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./.openui-mc/gradlew -p .openui-mc \
            :fabric-1.20.1:publishToMavenLocal \
            :forge-1.20.1:publishToMavenLocal \
            :fabric-1.21.1:publishToMavenLocal \
            :neoforge-1.21.1:publishToMavenLocal \
            :neoforge-26.1.2:publishToMavenLocal \
            --no-parallel --no-daemon
      - name: Upload OpenUI Maven Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openui-verification-m2
          path: ~/.m2/repository/com/nstut
          if-no-files-found: error

  test-core:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x gradlew
      - name: Core and harness checks
        run: python3 tools/verify.py core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-core
          path: build/verification/
          if-no-files-found: error

  test-shared:
    needs: prepare-openui
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore OpenUI Maven Local Cache
        id: cache-openui
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/nstut
          key: openui-maven-0d6e10dad6a5ba8615a5798c4369bc4cd6e73300
      - name: Download OpenUI Maven Artifacts Fallback
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: openui-verification-m2
          path: ~/.m2/repository/com/nstut
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x gradlew
      - name: Production service and version adapter checks
        run: python3 tools/verify.py adapters
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-shared
          path: build/verification/
          if-no-files-found: error

  live-join:
    needs: [policy, prepare-openui, test-shared]
    if: needs.policy.outputs.live_required == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore OpenUI Maven Local Cache
        id: cache-openui
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/nstut
          key: openui-maven-0d6e10dad6a5ba8615a5798c4369bc4cd6e73300
      - name: Download OpenUI Maven Artifacts Fallback
        if: steps.cache-openui.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: openui-verification-m2
          path: ~/.m2/repository/com/nstut
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x gradlew
      # The ubuntu-24.04 hosted runner already bundles Xvfb. Avoid a
      # network-dependent apt update, which can hang on its Azure mirror.
      - name: Verify preinstalled virtual display
        run: |
          command -v Xvfb
          command -v xvfb-run
      - name: Build target
        run: python3 tools/verify.py build --target "${{ matrix.target }}"
      - name: One real playback session per target
        run: python3 tools/verify.py live --target "${{ matrix.target }}"
      - name: Real ComputerCraft Lua acceptance
        if: matrix.target != 'neoforge-26.1.2'
        run: python3 tools/verify.py cc --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.target }}
          path: |
            build/verification/build-${{ matrix.target }}.*
            build/verification/live-${{ matrix.target }}.*
            build/verification/cc-${{ matrix.target }}.*
          if-no-files-found: error
      - name: Preserve game logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-logs-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/run/live-join/client/logs
            ${{ matrix.target }}/run/live-join/server/logs
            ${{ matrix.target }}/run/cc-lua/server/logs
          if-no-files-found: ignore

  verification-gate:
    needs: [policy, test-core, test-shared, live-join]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require successful jobs
        env:
          CORE: ${{ needs.test-core.result }}
          SHARED: ${{ needs.test-shared.result }}
          LIVE: ${{ needs.live-join.result }}
          REQUIRED: ${{ needs.policy.outputs.live_required }}
          POLICY: ${{ needs.policy.result }}
        run: |
          test "$POLICY" = success && test "$CORE" = success && test "$SHARED" = success
          if [ "$REQUIRED" = true ]; then test "$LIVE" = success; fi
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-*
          merge-multiple: true
          path: build/verification
      - name: Validate exact-source receipts
        env:
          REQUIRED: ${{ needs.policy.outputs.live_required }}
        run: |
          if [ "$REQUIRED" = true ]; then
            python3 tools/verify.py gate --release
          else
            python3 tools/verify.py gate --core-only
          fi
