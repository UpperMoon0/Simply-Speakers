plugins {
    id 'com.gradleup.shadow'
}

def commonProject = project(':common-1.20.1')
ext.minecraft_version = commonProject.minecraft_version
ext.architectury_api_version = commonProject.architectury_api_version
ext.forge_version = commonProject.forge_version

loom {
    forge {
        mixinConfig "simplyspeakers.mixins.json"
    }
    runs {
        ccLuaTestServer {
            server()
            property "simplyspeakers.ccLuaTest", "true"
            runDir("run/cc-lua/server")
            programArg "nogui"
        }
        liveJoinTestClient {
            client()
            runDir("run/live-join/client")
            property "simplyspeakers.liveJoinTest", "true"
            property "simplyspeakers.livePlaybackTest", "true"
            programArgs "--username", "SSCarrier", "--quickPlayMultiplayer", "127.0.0.1:25575"
        }
        liveJoinTestObserver {
            client()
            runDir("run/live-join/observer")
            property "simplyspeakers.liveJoinTest", "true"
            property "simplyspeakers.livePlaybackTest", "true"
            property "simplyspeakers.livePlaybackRole", "observer"
            programArgs "--username", "SSObserver", "--quickPlayMultiplayer", "127.0.0.1:25575"
        }
        liveJoinTestServer {
            server()
            property "simplyspeakers.livePlaybackTest", "true"
            property "simplyspeakers.requireComputerCraft", "true"
            runDir("run/live-join/server")
            programArg "nogui"
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "vazkii.patchouli:Patchouli:1.20.1-85-FORGE"
    forge "net.minecraftforge:forge:$project.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$project.architectury_api_version"

    // JLayer (non-MC dependency)
    implementation "javazoom:jlayer:1.0.1"

    // CC:Tweaked API (optional integration; compile-only)
    compileOnly "cc.tweaked:cc-tweaked-1.20.1-common-api:1.109.2"
    compileOnly "cc.tweaked:cc-tweaked-1.20.1-forge-api:1.109.2"
    // Full mod for dev clients/servers; never bundled or published as required.
    modLocalRuntime "cc.tweaked:cc-tweaked-1.20.1-forge:1.109.2"
    // Maven's development artifact leaves plain libraries outside the mod jar.
    // Forge must expose them through its runtime library loader.
    forgeRuntimeLibrary "cc.tweaked:cobalt:0.8.1"
    forgeRuntimeLibrary "com.jcraft:jzlib:1.1.3"
    ['netty-codec-http', 'netty-codec-socks', 'netty-handler-proxy'].each {
        forgeRuntimeLibrary("io.netty:${it}:4.1.82.Final") { transitive = false }
    }
    forgeRuntimeLibrary "javazoom:jlayer:1.0.1"
    shadowBundle "javazoom:jlayer:1.0.1" 

    // Shared common module (pure Java, no MC dependencies)
    // implementation for compile-time only
    // The common classes are bundled via common-1.20.1's shadowBundle and available through transformProductionForge
    implementation project(':common')

    // OpenUI MC — required client-side UI framework (matching Forge 1.20.1 module)
    modImplementation "com.nstut:openui-mc-forge-1.20.1:${project.openui_version}"

    common(project(path: ':common-1.20.1', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common-1.20.1', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'archives_name', rootProject.archives_name
    inputs.property 'mod_name', rootProject.mod_name
    inputs.property 'mod_description', rootProject.mod_description
    inputs.property 'mod_authors', rootProject.mod_authors
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'architectury_api_version', project.architectury_api_version
    inputs.property 'openui_version', rootProject.openui_version

    filesMatching('META-INF/mods.toml') {
        expand(
            version: project.version,
            archives_name: rootProject.archives_name,
            mod_name: rootProject.mod_name,
            mod_description: rootProject.mod_description,
            mod_authors: rootProject.mod_authors,
            minecraft_version: project.minecraft_version,
            architectury_api_version: project.architectury_api_version,
            openui_version: rootProject.openui_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // Keep our bundled JLayer private. Ad Astra also embeds JLayer under its
    // original package, which makes Forge reject both mods as split packages.
    relocate 'javazoom.jl', 'com.nstut.simplyspeakers.shadow.javazoom.jl'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Patchouli discovers definitions in the physical loader mod root, while the
// shared resource pack supplies the localized contents and textures.
processResources {
    from('../common/src/main/resources/data/simplyspeakers/patchouli_books') {
        into 'data/simplyspeakers/patchouli_books'
    }
}
