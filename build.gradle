plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

// Set default version-specific properties
rootProject.ext.minecraft_version = '1.20.1'
rootProject.ext.architectury_api_version = '9.2.14'
rootProject.ext.fabric_loader_version = '0.16.14'
rootProject.ext.fabric_api_version = '0.92.5+1.20.1'
rootProject.ext.forge_version = '1.20.1-47.4.0'

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        mavenLocal()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.blamejared.com' }
        // CC:Tweaked API (optional integration; compile-only)
        maven {
            url 'https://maven.squiddev.cc'
            content { includeGroup 'cc.tweaked' }
        }
        exclusiveContent {
            forRepository {
                maven { url 'https://maven.ryanhcode.dev/releases' }
            }
            filter { includeGroup 'dev.ryanhcode.sable-companion' }
        }
    }
}

afterEvaluate {
    architectury {
        minecraft = rootProject.ext.minecraft_version
    }

    subprojects {
        if (project.name == 'neoforge-26.1.2' || project.name == 'common') {
            return
        }
        apply plugin: 'dev.architectury.loom'
        apply plugin: 'architectury-plugin'
        apply plugin: 'maven-publish'

        base {
            // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
            archivesName = "$rootProject.archives_name-$project.name"
        }

        repositories {
            // Add repositories to retrieve artifacts from in here.
            // You should only use this when depending on other mods because
            // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
            // See https://docs.gradle.org/current/userguide/declaring_repositories.html
            // for more information about repositories.
        }

        loom {
            silentMojangMappingsLicense()
        }

        dependencies {
            def commonProjectName = project.name.replace('fabric', 'common').replace('neoforge', 'common').replace('forge', 'common')
            def commonProject = rootProject.findProject(commonProjectName)
            def mcVersion = commonProject ? commonProject.findProperty('minecraft_version') : rootProject.ext.minecraft_version
            
            minecraft "net.minecraft:minecraft:$mcVersion"
            mappings loom.officialMojangMappings()
        }

        java {
            // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
            // if it is present.
            // If you remove this line, sources will not be generated.
            withSourcesJar()

            def javaVersion = project.name.contains('1.21.1') ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
            sourceCompatibility = javaVersion
            targetCompatibility = javaVersion
        }

        tasks.withType(JavaCompile).configureEach {
            it.options.release = project.name.contains('1.21.1') ? 21 : 17
        }

        // Use the Minecraft-supported runtime as well as its bytecode target.
        // Forge 1.20.1's network handshake is not compatible with Java 21.
        tasks.withType(JavaExec).configureEach {
            def runtimeVersion = project.name.contains('1.21.1') ? 21 : 17
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(runtimeVersion)
            }
        }

        // Configure Maven publishing.
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    artifactId = base.archivesName.get()
                    from components.java
                }
            }

            // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
            repositories {
                // Add repositories to publish to here.
                // Notice: This block does NOT have the same function as the block in the top level.
                // The repositories here will be used for publishing your artifact, not for
                // retrieving dependencies.
            }
        }
    }
}

tasks.register('testAllVersions') {
    group = 'verification'
    description = 'Runs shared and version-specific tests for every supported Minecraft version.'
    if (findProject(':common-1.20.1') != null) {
        dependsOn ':common:test', ':common-1.20.1:test', ':common-1.21.1:test', ':neoforge-26.1.2:test'
    }
}

subprojects {
    tasks.withType(Test).configureEach {
        // Preserve actionable adapter failures in CI logs, not only ephemeral HTML.
        testLogging.exceptionFormat = 'full'
    }
    tasks.withType(JavaExec).configureEach {
        if (name == 'runLiveJoinTestServer') maxHeapSize = '1G'
        if (name == 'runLiveJoinTestClient') maxHeapSize = '2G'
        if (name == 'runLiveJoinTestObserver') maxHeapSize = '1G'
        if (name in ['runLiveJoinTestClient', 'runLiveJoinTestObserver']) {
            def role = name == 'runLiveJoinTestClient' ? 'client' : 'observer'
            def scratchDir = project.file("run/live-join/${role}/tmp")
            def nativeDir = new File(scratchDir, 'lwjgl')
            // LWJGL 3.3.1+ otherwise extracts into a user-wide temporary path.
            // Apply to the GAME JavaExec, not the supervising Gradle JVM.
            // https://javadoc.lwjgl.org/org/lwjgl/system/Configuration.html#SHARED_LIBRARY_EXTRACT_PATH
            systemProperty 'java.io.tmpdir', scratchDir.absolutePath
            systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', nativeDir.absolutePath
            systemProperty 'org.lwjgl.util.Debug', 'true'
            systemProperty 'org.lwjgl.util.DebugLoader', 'true'
            doFirst {
                if (!nativeDir.isDirectory() && !nativeDir.mkdirs()) {
                    throw new GradleException("Cannot create isolated client native directory: ${nativeDir}")
                }
            }
        }
    }
}

tasks.register('testCore') {
    group = 'verification'
    description = 'Runs version-neutral behavior and cross-version wiring checks without configuring Minecraft.'
    dependsOn ':common:test'
}

// Opt-in native screenshots/layout verification; ordinary launches remain unchanged.
subprojects {
    tasks.withType(JavaExec).configureEach {
        if (name == 'runClient' && rootProject.findProperty('uiPreview') == 'true') {
            systemProperty 'simplyspeakers.uiPreview', 'true'
            systemProperty 'simplyspeakers.uiAuditGroup', rootProject.findProperty('uiAuditGroup') ?: 'all'
        }
    }
}
