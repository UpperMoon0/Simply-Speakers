plugins { id 'net.fabricmc.fabric-loom' version '1.17.9' }
apply from: '../gradle/requested-port.gradle'
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.0+26.2'
    implementation 'dev.architectury:architectury-fabric:21.1.12'
    implementation files(portOpenuiJar)
    runtimeOnly files(portPacketweaveJar)
    include 'javazoom:jlayer:1.0.1'
}
processResources { filesMatching('fabric.mod.json') { expand version:project.version } }

// Opt-in native acceptance uses isolated worlds, real packet traffic and OpenAL.
loom.runs {
    liveJoinTestClient {
        client(); runDir('run/live-join/client')
        property 'simplyspeakers.liveJoinTest', 'true'
        property 'simplyspeakers.livePlaybackTest', 'true'
        property 'simplyspeakers.requestedPortRuntime', 'true'
        programArgs '--username', 'SSCarrier', '--quickPlayMultiplayer', '127.0.0.1:25575'
    }
    liveJoinTestObserver {
        client(); runDir('run/live-join/observer')
        property 'simplyspeakers.liveJoinTest', 'true'
        property 'simplyspeakers.livePlaybackTest', 'true'
        property 'simplyspeakers.livePlaybackRole', 'observer'
        property 'simplyspeakers.requestedPortRuntime', 'true'
        programArgs '--username', 'SSObserver', '--quickPlayMultiplayer', '127.0.0.1:25575'
    }
    liveJoinTestServer {
        server(); runDir('run/live-join/server')
        property 'simplyspeakers.livePlaybackTest', 'true'
        property 'simplyspeakers.requestedPortRuntime', 'true'
        programArg 'nogui'
    }
}
apply from: '../gradle/requested-live-runtime.gradle'
